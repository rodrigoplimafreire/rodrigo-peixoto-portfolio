amily="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0" opacity="1">Cal</text><text x="1248.4" y="564" font-size="13" fill="#8A8378" font-weight="400" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="0" opacity="1">#F5F2EC</text><text x="96" y="646" font-size="17" fill="#5C6360" font-weight="400" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0" opacity="1">Proporção de uso: cal e concreto sustentam, grafite estrutura, amarelo assina. Arroio marca progresso e</text><text x="96" y="672" font-size="17" fill="#5C6360" font-weight="400" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0" opacity="1">medição no produto.</text></svg>
