<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><rect width="1600" height="900" fill="#141414"/><rect x="0" y="0" width="1600" height="900" fill="#141414" /><text x="96" y="88" font-size="13" fill="#8C8880" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.5">07 · TOM DE VOZ &amp; MENSAGENS</text><text x="96" y="160" font-size="42" fill="#FAFAF8" font-weight="900" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="-0.84">FALA DE ENGENHEIRO,</text><text x="96" y="212" font-size="42" fill="#E7642C" font-weight="900" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="-0.84">COM O PÉ NO CHÃO.</text><rect x="96" y="280" width="320" height="168" fill="#1C1C1C" stroke="#2A2A2A"/><rect x="96" y="280" width="320" height="3" fill="#E7642C" /><text x="120" y="326" font-size="21" fill="#FAFAF8" font-weight="700" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Técnico</text><text x="120" y="362" font-size="14" fill="#B0ACA4" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Explica o porquê. Cita etapa,</text><text x="120" y="386" font-size="14" fill="#B0ACA4" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">medição, ART. Nunca esconde o</text><text x="120" y="410" font-size="14" fill="#B0ACA4" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">processo atrás de jargão.</text><rect x="452" y="280" width="320" height="168" fill="#1C1C1C" stroke="#2A2A2A"/><rect x="452" y="280" width="320" height="3" fill="#E7642C" /><text x="476" y="326" font-size="21" fill="#FAFAF8" font-weight="700" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Transparente</text><text x="476" y="362" font-size="14" fill="#B0ACA4" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Diz o preço, o prazo e o risco antes</text><text x="476" y="386" font-size="14" fill="#B0ACA4" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">de perguntarem.</text><rect x="808" y="280" width="320" height="168" fill="#1C1C1C" stroke="#2A2A2A"/><rect x="808" y="280" width="320" height="3" fill="#E7642C" /><text x="832" y="326" font-size="21" fill="#FAFAF8" font-weight="700" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Humilde</text><text x="832" y="362" font-size="14" fill="#B0ACA4" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Celebra a entrega sem se gabar.</text><text x="832" y="386" font-size="14" fill="#B0ACA4" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Gratidão por cada obra confiada.</text><rect x="1164" y="280" width="320" height="168" fill="#1C1C1C" stroke="#2A2A2A"/><rect x="1164" y="280" width="320" height="3" fill="#E7642C" /><text x="1188" y="326" font-size="21" fill="#FAFAF8" font-weight="700" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Empático</text><text x="1188" y="362" font-size="14" fill="#B0ACA4" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Entende a ansiedade de quem</text><text x="1188" y="386" font-size="14" fill="#B0ACA4" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">constrói. Responde em até 1 dia</text><text x="1188" y="410" font-size="14" fill="#B0ACA4" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">útil.</text><rect x="96" y="490" width="690" height="210" fill="#1C1C1C" stroke="#2E7D32"/><text x="124" y="532" font-size="15" fill="#5FBF63" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="0">✓  Escrevemos assim</text><text x="124" y="574" font-size="16" fill="#E7E5E1" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">“Orçamento por escrito, detalhado por etapa. Você aprova antes</text><text x="124" y="600" font-size="16" fill="#E7E5E1" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">de a gente começar.”</text><text x="124" y="636" font-size="16" fill="#E7E5E1" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">“Cada medição vem com foto. Você só paga a etapa depois de</text><text x="124" y="662" font-size="16" fill="#E7E5E1" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">vê-la pronta.”</text><rect x="814" y="490" width="690" height="210" fill="#1C1C1C" stroke="#C24E1C"/><text x="842" y="532" font-size="15" fill="#E08B6A" font-weight="600" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="0">✕  Evitamos</text><text x="842" y="574" font-size="15" fill="#B0ACA4" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">“A melhor construtora de Fortaleza, disparado.”</text><text x="842" y="608" font-size="15" fill="#B0ACA4" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">“Preço sob consulta, condições especiais imperdíveis!”</text><text x="842" y="642" font-size="15" fill="#B0ACA4" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Jargão vazio, promessa sem prazo, superlativo solto.</text><rect x="96" y="748" width="1408" height="1" fill="#2A2A2A" /><text x="96" y="792" font-size="10" fill="#6B675E" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.5">ASSINATURA PRINCIPAL</text><text x="96" y="828" font-size="20" fill="#FAFAF8" font-weight="600" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Prazo e orçamento</text><text x="96" y="856" font-size="20" fill="#FAFAF8" font-weight="600" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">respeitados.</text><text x="452" y="792" font-size="10" fill="#6B675E" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.5">CAMPANHA / SOCIAL</text><text x="452" y="828" font-size="20" fill="#FAFAF8" font-weight="600" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Sem surpresa no fim do</text><text x="452" y="856" font-size="20" fill="#FAFAF8" font-weight="600" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">mês.</text><text x="808" y="792" font-size="10" fill="#6B675E" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.5">PROVA / DIFERENCIAL</text><text x="808" y="828" font-size="20" fill="#FAFAF8" font-weight="600" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Engenheiro presente na</text><text x="808" y="856" font-size="20" fill="#FAFAF8" font-weight="600" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">obra.</text><text x="1164" y="792" font-size="10" fill="#6B675E" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.5">CHAMADA / CTA</text><text x="1164" y="828" font-size="20" fill="#E7642C" font-weight="600" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Sua obra começa por</text><text x="1164" y="856" font-size="20" fill="#E7642C" font-weight="600" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">aqui.</text></svg>
