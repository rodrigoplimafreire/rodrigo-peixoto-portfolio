<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><rect width="1600" height="1030" fill="#ECEBE8"/><rect x="0" y="0" width="1600" height="900" fill="#ECEBE8" /><text x="96" y="86" font-size="13" fill="#8C8880" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.5">SITE · TRIAGEM DE OBRA E PROCESSO</text><text x="96" y="152" font-size="36" fill="#141414" font-weight="900" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="-0.72">O ORÇAMENTO COMEÇA COM CINCO PERGUNTAS.</text><rect x="96" y="210" width="620" height="480" fill="#141414" /><rect x="96" y="210" width="620" height="4" fill="#E7642C" /><text x="132" y="256" font-size="11" fill="#6B675E" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.5">TRIAGEM DE OBRA · RD ENGENHARIA</text><rect x="132" y="276" width="548" height="4" fill="#2A2A2A" /><rect x="132" y="276" width="110" height="4" fill="#E7642C" /><text x="132" y="306" font-size="11" fill="#E7642C" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.5">PERGUNTA 1 DE 5</text><text x="132" y="360" font-size="30" fill="#FAFAF8" font-weight="900" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="-0.6">QUE TIPO DE OBRA</text><text x="132" y="396" font-size="30" fill="#FAFAF8" font-weight="900" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="-0.6">VOCÊ PRECISA?</text><rect x="132" y="436" width="548" height="44" fill="#1C1C1C" stroke="#2E2E2E"/><text x="152" y="464" font-size="15" fill="#E7E5E1" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Reforma residencial</text><text x="656" y="464" font-size="15" fill="#E7642C" font-weight="600" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end" letter-spacing="0">→</text><rect x="132" y="492" width="548" height="44" fill="#1C1C1C" stroke="#2E2E2E"/><text x="152" y="520" font-size="15" fill="#E7E5E1" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Construção do zero</text><text x="656" y="520" font-size="15" fill="#E7642C" font-weight="600" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end" letter-spacing="0">→</text><rect x="132" y="548" width="548" height="44" fill="#1C1C1C" stroke="#2E2E2E"/><text x="152" y="576" font-size="15" fill="#E7E5E1" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Obra comercial</text><text x="656" y="576" font-size="15" fill="#E7642C" font-weight="600" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end" letter-spacing="0">→</text><rect x="132" y="604" width="548" height="44" fill="#1C1C1C" stroke="#2E2E2E"/><text x="152" y="632" font-size="15" fill="#E7E5E1" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Laudo técnico / gestão</text><text x="656" y="632" font-size="15" fill="#E7642C" font-weight="600" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end" letter-spacing="0">→</text><text x="132" y="672" font-size="10" fill="#6B675E" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.5">CREA ATIVO · RESPOSTA EM 1 DIA ÚTIL</text><text x="776" y="244" font-size="26" fill="#141414" font-weight="700" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Como a RD trabalha</text><text x="776" y="278" font-size="16" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Um processo só, do primeiro contato à chave na mão. Você sabe o</text><text x="776" y="304" font-size="16" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">que acontece em cada etapa — e quanto custa — antes de ela</text><text x="776" y="330" font-size="16" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">começar.</text><rect x="776" y="360" width="728" height="1" fill="#D9D6D0" /><text x="776" y="404" font-size="13" fill="#E7642C" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.4">01</text><text x="840" y="406" font-size="21" fill="#141414" font-weight="700" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Triagem e visita técnica</text><text x="840" y="436" font-size="15" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Formulário em 1 minuto. Retorno em até 1 dia útil e visita</text><text x="840" y="460" font-size="15" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">agendada.</text><rect x="776" y="492" width="728" height="1" fill="#D9D6D0" /><text x="776" y="536" font-size="13" fill="#E7642C" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.4">02</text><text x="840" y="538" font-size="21" fill="#141414" font-weight="700" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Orçamento por escrito</text><text x="840" y="568" font-size="15" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Orçamento fechado, detalhado por etapa — sem estimativa vaga.</text><rect x="776" y="624" width="728" height="1" fill="#D9D6D0" /><text x="776" y="668" font-size="13" fill="#E7642C" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.4">03</text><text x="840" y="670" font-size="21" fill="#141414" font-weight="700" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Cronograma assinado</text><text x="840" y="700" font-size="15" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">As datas de cada etapa ficam registradas e assinadas junto com</text><text x="840" y="724" font-size="15" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">o contrato.</text><rect x="776" y="756" width="728" height="1" fill="#D9D6D0" /><text x="776" y="800" font-size="13" fill="#E7642C" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.4">04</text><text x="840" y="802" font-size="21" fill="#141414" font-weight="700" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Execução e entrega</text><text x="840" y="832" font-size="15" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Engenheiro presente, fotos a cada medição e entrega com</text><text x="840" y="856" font-size="15" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">checklist assinado.</text><rect x="96" y="906" width="1408" height="1" fill="#D9D6D0" /><rect x="96" y="946" width="300" height="44" fill="#FAFAF8" stroke="#D9D6D0"/><text x="120" y="974" font-size="14" fill="#141414" font-weight="500" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Resposta em 1 dia útil</text><rect x="96" y="946" width="4" height="44" fill="#E7642C" /><rect x="452" y="946" width="300" height="44" fill="#FAFAF8" stroke="#D9D6D0"/><text x="476" y="974" font-size="14" fill="#141414" font-weight="500" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Orçamento por escrito</text><rect x="452" y="946" width="4" height="44" fill="#E7642C" /><rect x="808" y="946" width="300" height="44" fill="#FAFAF8" stroke="#D9D6D0"/><text x="832" y="974" font-size="14" fill="#141414" font-weight="500" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">ART e nota fiscal</text><rect x="808" y="946" width="4" height="44" fill="#E7642C" /><rect x="1164" y="946" width="300" height="44" fill="#FAFAF8" stroke="#D9D6D0"/><text x="1188" y="974" font-size="14" fill="#141414" font-weight="500" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Sem compromisso</text><rect x="1164" y="946" width="4" height="44" fill="#E7642C" /></svg>
