<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><rect width="1600" height="900" fill="#ECEBE8"/><rect x="0" y="0" width="1600" height="900" fill="#ECEBE8" /><text x="96" y="88" font-size="13" fill="#8C8880" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.5">01 · CONCEITO &amp; HISTÓRIA</text><text x="96" y="168" font-size="46" fill="#141414" font-weight="900" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="-0.92">UMA MARCA CONSTRUÍDA</text><text x="96" y="222" font-size="46" fill="#E7642C" font-weight="900" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="-0.92">BLOCO A BLOCO.</text><text x="96" y="286" font-size="20" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">A identidade nasce do próprio ofício: engenharia é montar, com</text><text x="96" y="318" font-size="20" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">método, peças que se encaixam. O símbolo é um sistema modular —</text><text x="96" y="350" font-size="20" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">quadrados iguais que formam o “D” e a seta que aponta adiante.</text><rect x="1060" y="210" width="264" height="264" fill="#FAFAF8" stroke="#D9D6D0"/><rect x="1060" y="210" width="1" height="264" fill="#D9D6D0" /><rect x="1060" y="210" width="264" height="1" fill="#D9D6D0" /><rect x="1148" y="210" width="1" height="264" fill="#D9D6D0" /><rect x="1060" y="298" width="264" height="1" fill="#D9D6D0" /><rect x="1236" y="210" width="1" height="264" fill="#D9D6D0" /><rect x="1060" y="386" width="264" height="1" fill="#D9D6D0" /><rect x="1324" y="210" width="1" height="264" fill="#D9D6D0" /><rect x="1060" y="474" width="264" height="1" fill="#D9D6D0" /><rect x="1060" y="210" width="88" height="264" fill="#141414" /><rect x="1148" y="210" width="176" height="88" fill="#141414" /><rect x="1148" y="386" width="176" height="88" fill="#141414" /><path d="M1162 312 L1310 312 L1310 372 Z" fill="#E7642C"/><text x="1060" y="508" font-size="11" fill="#8C8880" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.5">GRADE 3 × 3 · MÓDULO 70 PT</text><text x="1060" y="532" font-size="11" fill="#8C8880" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.5">ÂNGULOS 45° · BLOCO + VÃO + SETA</text><rect x="96" y="600" width="420" height="3" fill="#E7642C" /><text x="96" y="640" font-size="12" fill="#8C8880" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.4">02</text><text x="96" y="682" font-size="24" fill="#141414" font-weight="700" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Modular</text><text x="96" y="722" font-size="16" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">O símbolo se constrói a partir de uma malha</text><text x="96" y="748" font-size="16" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">de quadrados iguais — a mesma lógica de uma</text><text x="96" y="774" font-size="16" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">obra bem projetada.</text><rect x="566" y="600" width="420" height="3" fill="#141414" /><text x="566" y="640" font-size="12" fill="#8C8880" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.4">03</text><text x="566" y="682" font-size="24" fill="#141414" font-weight="700" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Transparente</text><text x="566" y="722" font-size="16" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">O vão aberto é intencional: mostra o que há</text><text x="566" y="748" font-size="16" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">por dentro. Orçamento por escrito, cada</text><text x="566" y="774" font-size="16" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">etapa à vista.</text><rect x="1036" y="600" width="420" height="3" fill="#141414" /><text x="1036" y="640" font-size="12" fill="#8C8880" font-weight="500" font-family="'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace" text-anchor="start" letter-spacing="1.4">04</text><text x="1036" y="682" font-size="24" fill="#141414" font-weight="700" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">Em movimento</text><text x="1036" y="722" font-size="16" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">A seta aponta adiante — a obra que avança no</text><text x="1036" y="748" font-size="16" fill="#6B675E" font-weight="400" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="start" letter-spacing="0">prazo, a entrega que chega.</text></svg>
